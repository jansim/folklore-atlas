<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Folk Atlas</title>
    <meta name="description" content="Folktales from around the world as wisps of light over a globe, from the trilogy Annotated Folktales." />
    <meta name="theme-color" content="#070B1C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg id="sky" aria-hidden="true"></svg>

    <div id="world" tabindex="0" aria-label="Map of tales. Drag or use the arrow keys to turn it; scroll, pinch or press + and − to zoom.">
      <canvas id="backdrop" aria-hidden="true"></canvas>
      <canvas id="map" aria-hidden="true"></canvas>
      <canvas id="sky-wisps" aria-hidden="true"></canvas>
      <div id="labels" aria-hidden="true"></div>
      <div id="wisps" class="sr-only" role="group" aria-label="Tales on the map"></div>
    </div>

    <header class="top" data-nozoom>
      <a class="brand" href="./">Folk Atlas</a>
      <div class="search">
        <label class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
          </svg>
          <input
            id="search"
            type="search"
            aria-label="Search tales"
            placeholder="Search a tale, a type, a land"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="results"
            aria-autocomplete="list"
          />
        </label>
        <ul id="results" role="listbox" aria-label="Matching tales" hidden></ul>
      </div>
    </header>

    <aside id="panel" data-nozoom hidden aria-live="polite">
      <button class="sheet-toggle" id="sheet-toggle" aria-expanded="true" aria-label="Show less of this tale"><span></span></button>
      <button class="close" id="close" aria-label="Close this tale">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
      <div class="p-head">
        <button class="to-list" id="to-list" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M15 5l-7 7 7 7"></path>
          </svg>
        </button>
        <div class="eyebrow" id="tale-place"></div>
      </div>
      <h1 id="tale-title"></h1>
      <div class="tale-type tv" id="tale-type"></div>

      <p class="excerpt tv" id="tale-excerpt"></p>
      <button class="primary tv" id="read">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13c-3-.5-6 0-8 1.5zM12 6v13"></path>
        </svg>
        Read the tale
      </button>
      <section class="kindred tv">
        <div class="kh gold"><span id="kin-head"></span><span class="q" tabindex="0" aria-describedby="kin-tip">?</span><span class="tip" role="tooltip" id="kin-tip"></span></div>
        <div class="kin-chips" id="kin-chips"></div>
      </section>
      <section class="kindred tv">
        <div class="kh silver"><span id="fam-head"></span><span class="q" tabindex="0" aria-describedby="fam-tip">?</span><span class="tip" role="tooltip" id="fam-tip"></span></div>
        <div class="kin-chips" id="fam-chips"></div>
      </section>
      <section class="list lv" id="list"></section>
      <section class="others tv" id="others" hidden>
        <span class="kh" id="others-head"></span>
        <div id="others-list"></div>
      </section>
    </aside>

    <div id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="r-title">
      <div class="r-scroll" id="r-scroll">
        <article class="r-article">
          <header class="r-head">
            <div class="kh gold" id="r-place"></div>
            <button class="r-close" id="r-close" aria-label="Close the tale and return to the atlas">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18"></path>
              </svg>
            </button>
            <h1 id="r-title"></h1>
            <div class="tale-type r-type" id="r-type"></div>
            <div class="r-rule" aria-hidden="true"><span></span><i></i><span></span></div>
          </header>
          <div id="reading" tabindex="-1"></div>
          <div class="r-stars" aria-hidden="true">✦ ✦ ✦</div>
          <p class="r-source" id="r-source"></p>
          <button class="r-back" id="back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path>
            </svg>
            Back to the atlas
          </button>
          <section class="r-kin" id="r-kin" hidden>
            <div class="kh gold"><span>Similar tales are also told in</span><span class="q" tabindex="0" aria-describedby="r-kin-tip">?</span><span class="tip" role="tooltip" id="r-kin-tip"></span></div>
            <div class="kin-chips" id="r-kin-chips"></div>
          </section>
          <section class="r-kin" id="r-fam" hidden>
            <div class="kh silver"><span>Tales of a similar family are told in</span><span class="q" tabindex="0" aria-describedby="r-fam-tip">?</span><span class="tip" role="tooltip" id="r-fam-tip"></span></div>
            <div class="kin-chips" id="r-fam-chips"></div>
          </section>
          <section class="r-others" id="r-others" hidden>
            <span class="kh" id="r-others-head"></span>
            <div id="r-others-list"></div>
          </section>
        </article>
      </div>
      <div class="r-bar" id="r-bar">
        <div class="r-mini" aria-hidden="true"><span id="r-mini-title"></span><span class="kh gold" id="r-mini-place"></span></div>
        <div class="r-tools">
          <button class="tb" id="fs-down" aria-label="Smaller text">A−</button>
          <button class="tb big" id="fs-up" aria-label="Larger text">A+</button>
        </div>
      </div>
    </div>

    <div id="atu-scrim" hidden></div>
    <div id="atu" role="dialog" aria-modal="true" aria-labelledby="atu-title" hidden>
      <button class="close" id="atu-close" aria-label="Close the index of tale types">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
      <header class="atu-head">
        <nav class="atu-crumbs" id="atu-crumbs" aria-label="Tale types"></nav>
        <h2 id="atu-title" tabindex="-1"></h2>
        <div class="atu-sub" id="atu-sub"></div>
      </header>
      <div class="atu-body" id="atu-body"></div>
    </div>

    <div id="loading" role="status">Gathering the wisps…</div>

    <footer class="hint" data-nozoom>
      <p class="credit">
        Tales from the Annotated Folktales in
        <a href="https://github.com/j-hagedorn/trilogy" target="_blank" rel="noopener">trilogy</a> (CC BY-SA 4.0), gathered by D. L.
        Ashliman in <a href="https://sites.pitt.edu/~dash/folktexts.html" target="_blank" rel="noopener">Folktexts</a>. Map:
        <a href="https://www.naturalearthdata.com" target="_blank" rel="noopener">Natural Earth</a>. Places are approximate.
      </p>
    </footer>

    <div class="controls" data-nozoom role="group" aria-label="View">
      <button class="chip" id="to-globe">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path>
        </svg>
        Globe
      </button>
      <button class="chip" id="to-flat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M3 12h18M9 5v14M15 5v14"></path>
        </svg>
        Flat map
      </button>
      <div class="zoom">
        <button class="zb" id="zoom-out" aria-label="Zoom out">−</button>
        <div class="zoom-bar" aria-hidden="true"><span id="zoom-level"></span></div>
        <button class="zb" id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
