<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Folk Atlas</title>
    <meta name="description" content="Folktales from around the world as wisps of light over a globe, from the trilogy Annotated Folktales." />
    <meta name="theme-color" content="#070B1C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg id="sky" aria-hidden="true"></svg>

    <div id="world" tabindex="0" aria-label="Map of tales. Drag or use the arrow keys to turn it; scroll, pinch or press + and − to zoom.">
      <canvas id="backdrop" aria-hidden="true"></canvas>
      <canvas id="map" aria-hidden="true"></canvas>
      <canvas id="sky-wisps" aria-hidden="true"></canvas>
      <div id="labels" aria-hidden="true"></div>
      <div id="wisps" class="sr-only" role="group" aria-label="Tales on the map"></div>
    </div>

    <header class="top" data-nozoom>
      <a class="brand" href="./">Folk Atlas</a>
      <div class="search">
        <label class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
          </svg>
          <input
            id="search"
            type="search"
            aria-label="Search tales"
            placeholder="Search a tale, a type, a land"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="results"
            aria-autocomplete="list"
          />
        </label>
        <ul id="results" role="listbox" aria-label="Matching tales" hidden></ul>
      </div>
    </header>

    <aside id="panel" data-nozoom hidden aria-live="polite">
      <button class="sheet-toggle" id="sheet-toggle" aria-expanded="true" aria-label="Show less of this tale"><span></span></button>
      <button class="close" id="close" aria-label="Close this tale">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
      <div class="eyebrow" id="tale-place"></div>
      <h1 id="tale-title"></h1>
      <div class="tale-type">
        <span id="tale-atu"></span>
        <span id="tale-family"></span>
      </div>

      <div id="tale-summary">
        <p class="excerpt" id="tale-excerpt"></p>
        <section class="kindred">
          <div class="kin-head">
            <span class="eyebrow muted" id="kin-head"></span>
            <div class="segs" role="group" aria-label="Show tellings of">
              <button class="seg" id="mode-type" aria-pressed="true">Same tale</button>
              <button class="seg" id="mode-family" aria-pressed="false">Same family</button>
            </div>
          </div>
          <div class="kin-chips" id="kin-chips"></div>
        </section>
        <section class="others" id="others" hidden>
          <span class="eyebrow muted" id="others-head"></span>
          <div id="others-list"></div>
        </section>
        <button class="primary" id="read">Read the tale</button>
      </div>

      <div id="tale-reading" hidden>
        <div class="reading" id="reading" tabindex="0" aria-label="Tale text"></div>
        <button class="secondary" id="back">Back to the map</button>
      </div>
    </aside>

    <div id="loading" role="status">Gathering the wisps…</div>

    <footer class="hint" data-nozoom>
      <p id="hint">Scroll to zoom. Zoom out and the world becomes a globe; drag to turn it.</p>
      <p class="credit">
        Tales from the Annotated Folktales in
        <a href="https://github.com/j-hagedorn/trilogy" target="_blank" rel="noopener">trilogy</a> (CC BY-SA 4.0), gathered by D. L.
        Ashliman in <a href="https://sites.pitt.edu/~dash/folktexts.html" target="_blank" rel="noopener">Folktexts</a>. Map:
        <a href="https://www.naturalearthdata.com" target="_blank" rel="noopener">Natural Earth</a>. Places are approximate.
      </p>
    </footer>

    <div class="controls" data-nozoom role="group" aria-label="View">
      <button class="chip" id="to-globe">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path>
        </svg>
        Globe
      </button>
      <button class="chip" id="to-flat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M3 12h18M9 5v14M15 5v14"></path>
        </svg>
        Flat map
      </button>
      <div class="zoom">
        <button class="zb" id="zoom-out" aria-label="Zoom out">−</button>
        <div class="zoom-bar" aria-hidden="true"><span id="zoom-level"></span></div>
        <button class="zb" id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
